<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ISIC 经济活动研究</title>
<style>
body{margin:0;font:14px/1.65 system-ui,sans-serif;color:#19382f;background:#f4f6f0;overflow-wrap:anywhere}
header{padding:22px 28px;border-bottom:1px solid #becdc1}h1{margin:0;font-size:25px}h2{font-size:21px}h3{margin-bottom:7px}p{margin:8px 0}
main{display:grid;grid-template-columns:minmax(220px,360px) minmax(0,1fr);max-width:1500px;margin:auto}
aside{padding:18px;border-right:1px solid #d0dbd0;height:calc(100vh - 160px);overflow:auto}
section{padding:20px 30px}#detail{min-width:0;scroll-margin-top:10px}
input,select{box-sizing:border-box;max-width:100%;padding:8px;font:inherit;border:1px solid #b5c7b9;border-radius:4px;background:white}
input{width:100%;margin:10px 0}details{margin:5px 0}details details{margin-left:14px}summary{cursor:pointer}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:15px;border:1px solid #d6dfd3}
article{background:white;border:1px solid #d6dfd3;border-radius:5px;padding:12px;margin:9px 0}
.flag{color:#87501a}a{color:#146344}.node-link{display:block;padding:3px 0}.reference a{display:inline-block;margin-right:10px}
small{display:block;color:#5f7467}
@media(max-width:750px){main{grid-template-columns:minmax(0,1fr)}aside{height:280px;border-bottom:1px solid #becdc1}section{padding:18px}}
</style>
<header>
  <nav aria-label="经济活动导航"><a href="../../../reports/registry.html?domain=01-economy">返回经济活动来源注册表</a></nav>
  <small>WORLD CLASSIFICATION ATLAS / 经济活动分类研究</small>
  <h1>ISIC 原目录、定义与版本对应</h1>
  <p id="stats"></p>
  <small>官方对应表发布于 2025-01-17。当前 Rev.5 注释来自 2026-08-19 更新。各条对应分别显示发布信息和 Atlas 审查。</small>
</header>
<main>
  <aside>
    <select id="edition" aria-label="目录或源版本"><option value="Atlas">Atlas 已审活动目录 · 局部</option><option value="Rev.5">ISIC Rev.5 · 2026-08 注释</option><option value="Rev.4">ISIC Rev.4 · 数据库更正版</option></select>
    <input id="q" placeholder="搜索代码、名称、说明或排除项" aria-label="搜索节点">
    <details><summary>待审目录提案</summary><div id="proposals"></div></details>
    <small id="count"></small><div id="results"></div>
  </aside>
  <section id="detail" tabindex="-1"><p>选择节点查看定义、版本对应和证据。</p></section>
</main>
<script id="data" type="application/json">__ECONOMY_DATA__</script><script>
const data = JSON.parse(document.getElementById('data').textContent);
const el = id => document.getElementById(id);
function make(tag, text, parent) {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  if (parent) parent.append(node);
  return node;
}
const byId = new Map([...data.old, ...data.new].map(node => [node.id, node]));
const directory = new Map(data.review.directory.map(node => [node.id, node]));
const proposals = new Map(data.review.directory_proposals.map(node => [node.id, node]));
const queue = new Map(data.review.queue.map(row => [row.mapping_id, row]));
const cases = new Map([...data.review.cases.map(row => [row.mapping_id, row]),
  ...data.review.supplemental_mappings.map(row => [row.id, row])]);
const claims = new Map(data.dossiers.map(claim => [claim.id, claim]));
const stats = data.review.statistics;
el('stats').textContent = `Rev.4 ${data.old.length} 个节点 · Rev.5 ${data.new.length} 个节点 · ${data.edges.length} 条官方对应 · 已审关系 ${stats.mapping_status.reviewed_current_relation} 条 · 研究补充 ${stats.supplemental_mapping_status.accepted_scoped_overlap || 0} 条 · Atlas 类锚点 ${stats.reviewed_rev5_classes} 个 + 自有活动 ${stats.directory_kinds.reviewed_activity_slice || 0} 个 · 开放问题 ${stats.unresolved_issues} 项`;

function nodeLink(id, label, parent) {
  const link = make('a', label, parent);
  link.href = '#' + encodeURIComponent(id);
  link.className = 'node-link';
}
function group(parent, id, title) {
  const box = make('div', undefined, parent);
  box.id = id;
  make('h3', title, box);
  return box;
}
function disclosure(parent, title) {
  const box = make('details', undefined, parent);
  make('summary', title, box);
  return box;
}
function evidence(parent, item) {
  const row = make('div', undefined, parent);
  row.className = 'reference';
  const locator = [item.resource_id, item.sheet, item.row && '第 ' + item.row + ' 行', item.range,
    item.pdf_page && 'PDF 物理第 ' + item.pdf_page + ' 页', item.table, item.key && '代码 ' + item.key]
    .filter(Boolean).join(' · ');
  make('small', locator, row);
  const path = data.original_files[item.resource_id];
  if (path) {
    const local = make('a', '打开本地原件', row);
    local.className = 'source-file';
    local.href = path + (item.pdf_page ? '#page=' + item.pdf_page : '');
    local.target = '_blank';
    local.rel = 'noopener';
  } else {
    make('span', '本地原件入口缺失', row).className = 'flag';
  }
  const official = make('a', '官方来源', row);
  official.href = item.url;
  official.target = '_blank';
  official.rel = 'noopener noreferrer';
  make('small', 'SHA-256 ' + item.sha256, row);
}
function showClaims(parent, ids) {
  for (const id of ids || []) {
    const claim = claims.get(id);
    const box = disclosure(parent, [id, claim.document, claim.field].join(' · '));
    make('pre', claim.selected_source_text, box);
    evidence(box, claim.evidence);
    make('small', `Unicode [${claim.start},${claim.end}) · 节选 SHA-256 ${claim.text_sha256}`, box);
  }
}
function detail(id, title) {
  const out = el('detail');
  out.replaceChildren(make('h2', title), make('small', id));
  return out;
}
function atlasSelect(node) {
  const out = detail(node.id, node.label);
  const kind = {
    reviewed_activity: '已审 Rev.5 范围锚点。各旧类的部分关联独立记录。',
    reviewed_activity_slice: 'Atlas 自有活动范围，属于所引来源类的一部分，官方代码见来源。',
    source_derived_navigation: '来源骨架导航节点，仅用于目录层级。'
  };
  make('p', kind[node.kind], out);
  for (const id of node.parents) nodeLink(id, '上级 · ' + directory.get(id).label, out);
  make('pre', node.definition || '未提供独立说明', out);
  if (node.activity_review_status === 'accepted_current_activity') make('p', '仅Rev.5当前范围已审。', out);
  const approved = group(out, 'approved-sources', 'Atlas → 来源（关系方向）');
  for (const binding of node.source_bindings) {
    nodeLink(binding.node_id, binding.node_id + ' · ' + (binding.relation || '仅导航来源'), approved);
    if (binding.review_mapping_id) {
      const review = cases.get(binding.review_mapping_id);
      make('p', review.review ? (review.review.cohort_rationale || review.review.rationale) : review.rationale, approved);
      if (review.origin) make('p', '来源层 · ' + review.origin, approved);
      evidence(approved, review.evidence);
    }
    showClaims(approved, binding.claim_ids);
  }
  if (node.candidate_source_bindings?.length) {
    const pending = group(out, 'candidate-sources', '待审来源');
    for (const binding of node.candidate_source_bindings) {
      const box = make('article', undefined, pending);
      nodeLink(binding.node_id, '待审来源 · ' + binding.node_id, box);
      make('p', binding.status + ' · 未批准关系', box).className = 'flag';
      make('p', binding.rationale, box);
      showClaims(box, binding.claim_ids);
    }
  }
  make('small', node.parent_basis, out);
}
function proposalSelect(node) {
  const out = detail(node.id, node.label);
  make('p', '待审目录提案 · ' + node.status, out).className = 'flag';
  make('pre', node.scope, out);
  make('p', node.rationale, out);
  make('p', '没有已批准的来源绑定。', out);
  const parents = group(out, 'proposal-parents', '候选当前归属');
  for (const id of node.candidate_parent_source_ids) nodeLink(id, '候选当前归属 · ' + id, parents);
  showClaims(out, node.claim_ids);
}
function showBacklinks(node, out) {
  const approved = data.review.directory.filter(a => a.source_bindings.some(b => b.node_id === node.id));
  if (approved.length) {
    const box = group(out, 'approved-backlinks', 'Atlas 局部目录与已审活动');
    for (const activity of approved) nodeLink(activity.id, activity.label, box);
  }
  const candidates = data.review.source_to_candidates[node.id] || [];
  if (candidates.length) {
    const box = group(out, 'candidate-backlinks', '待审活动来源关联');
    for (const candidate of candidates) {
      nodeLink(candidate.atlas_id, directory.get(candidate.atlas_id).label, box);
      make('p', candidate.status + ' · 未批准关系', box).className = 'flag';
    }
  }
  const relatedProposals = [...proposals.values()].filter(p => p.candidate_parent_source_ids.includes(node.id));
  if (relatedProposals.length) {
    const box = group(out, 'proposal-backlinks', '待审目录提案的候选归属');
    for (const proposal of relatedProposals) nodeLink(proposal.id, proposal.label, box);
  }
}
function showErrata(node, out) {
  if (node.edition !== 'Rev.5') return;
  const entry = data.errata.find(row => row.code === node.code);
  if (!entry) return;
  const review = data.review.errata_reviews.find(row => row.code === node.code);
  const box = disclosure(out, '2024 原说明与 2026 更新说明');
  box.id = 'errata';
  make('p', entry.reason || '', box);
  make('p', review.effect + ' / ' + review.text_agreement, box);
  make('p', review.rationale, box);
  make('h4', '2024 原说明', box);
  make('pre', entry.original_note_2024 || '', box);
  make('h4', '2026 更新说明', box);
  make('pre', entry.updated_note_2026 || '', box);
  evidence(box, entry.evidence);
  if (review.priority_finding) {
    make('p', review.priority_finding.status, box);
    make('p', review.priority_finding.rationale, box);
    showClaims(box, review.priority_finding.claim_ids);
  }
}
function showIssues(node, out) {
  for (const issue of data.review.issues) {
    const codes = node.edition === 'Rev.4' ? issue.rev4_codes : issue.rev5_codes;
    if (!codes.includes(node.code)) continue;
    const box = make('article', undefined, out);
    make('h3', '问题记录 · ' + issue.id + ' · ' + issue.status, box);
    make('p', issue.rationale, box);
    if (issue.followup) {
      make('p', issue.followup.rationale, box);
      make('p', '发布者解决状态 · ' + issue.followup.publisher_resolution, box);
    }
  }
}
function showSupplements(node, out) {
  const section = group(out, 'supplemental-rows', 'Atlas 活动证据补充（独立于官方表）');
  for (const row of data.review.supplemental_mappings) {
    const from = 'ISIC:Rev.4:' + row.from_code;
    const to = 'ISIC:Rev.5:' + row.to_code;
    if (node.id !== from && node.id !== to) continue;
    const box = make('article', undefined, section);
    nodeLink(node.id === from ? to : from, row.from_code + '（Rev.4） → ' + row.to_code + '（Rev.5）', box);
    make('p', row.origin + ' · ' + row.status + ' · ' + (row.relation || '未批准关系'), box);
    make('p', row.rationale, box);
    make('p', row.scope_limit, box);
    evidence(box, row.evidence);
    for (const id of row.activity_ids) nodeLink(id, directory.get(id).label, box);
    showClaims(box, row.claim_evidence.map(claim => claim.id));
  }
}
function showOfficial(node, out) {
  const section = group(out, 'official-rows', '官方类级对应');
  const edges = data.edges.filter(edge => edge.from === node.id || edge.to === node.id);
  if (!edges.length) make('p', '该节点暂无直接类级对应。', section);
  for (const edge of edges) {
    const box = make('article', undefined, section);
    const peer = edge.from === node.id ? edge.to : edge.from;
    const review = queue.get(edge.id);
    const caseRecord = cases.get(edge.id);
    nodeLink(peer, edge.from_code + '（Rev.4） → ' + edge.to_code + '（Rev.5）', box);
    make('p', (edge.gsim_raw || 'GSIM 空白') + ' · ' + edge.topology, box);
    make('p', `原范围 ${edge.from_scope} / 新范围 ${edge.to_scope}（按完整类级对应推断）`, box);
    make('p', '研究候选 · ' + (edge.current_skos_candidate || '待审'), box);
    make('p', `审查 · ${review.status} · Rev.4 → Rev.5 ${review.reviewed_relation_rev4_to_rev5 || '未批准关系'}`, box);
    make('p', edge.decision_status, box);
    make('pre', edge.change_description || '', box);
    if (caseRecord) {
      if (caseRecord.review.cohort_rationale) make('p', caseRecord.review.cohort_rationale, box);
      make('p', caseRecord.review.rationale, box);
      if (caseRecord.activity_ids) {
        make('p', caseRecord.scope_limit, box);
        for (const id of caseRecord.activity_ids) nodeLink(id, '已审活动 · ' + directory.get(id).label, box);
      }
    }
    if (review.issue_ids.length) make('p', '问题 · ' + review.issue_ids.join(', '), box);
    if (edge.publisher_uncertainty) make('p', '发布者原文含问号，保留不确定。', box);
    if (edge.qualified_code_issues.length) make('pre', JSON.stringify(edge.qualified_code_issues, null, 2), box);
    if (edge.updated_notes_affected_codes.length) make('p', '2026 注释影响节点 · ' + edge.updated_notes_affected_codes.join(', '), box);
    evidence(box, edge.evidence);
  }
}
function select(id) {
  if (proposals.has(id)) return proposalSelect(proposals.get(id));
  if (directory.has(id)) return atlasSelect(directory.get(id));
  const node = byId.get(id);
  if (!node) {
    el('detail').replaceChildren(make('p', '此本地目录未收录该节点 · ' + id));
    return;
  }
  const out = detail(node.id, `${node.edition} · ${node.code} ${node.label}`);
  make('p', node.component, out);
  const parents = make('div', undefined, out);
  parents.id = 'original-parents';
  make('p', node.parents.length ? '原始父级' : '根节点', parents);
  for (const code of node.parents) {
    const parent = byId.get(`ISIC:${node.edition}:${code}`);
    nodeLink(parent.id, code + ' ' + parent.label, parents);
  }
  evidence(out, node.evidence);
  make('h3', '官方说明与范围', out);
  make('pre', node.definition || '官方数据库未提供独立说明。', out);
  for (const concept of data.concepts.filter(c => c.source_bindings.some(b => b.node_id === id))) {
    make('h3', '已审 Atlas 研究概念', out);
    make('p', concept.id, out);
    for (const binding of concept.source_bindings) nodeLink(binding.node_id, binding.node_id + ' · ' + binding.relation, out);
  }
  showBacklinks(node, out);
  showErrata(node, out);
  showIssues(node, out);
  showSupplements(node, out);
  showOfficial(node, out);
}
function browse() {
  const mode = el('edition').value;
  const nodes = mode === 'Atlas' ? data.review.directory.map(node => ({
    ...node, code: node.kind === 'reviewed_activity_slice' ? 'Atlas活动' : node.anchor_source_id.split(':').pop()
  })) : mode === 'Rev.4' ? data.old : data.new;
  const query = el('q').value.toLowerCase();
  const out = el('results');
  out.replaceChildren();
  const label = node => node.code + ' ' + node.label;
  if (query) {
    const rows = nodes.filter(node => (label(node) + ' ' + (node.definition || '')).toLowerCase().includes(query));
    el('count').textContent = `匹配 ${rows.length}，显示前 ${Math.min(100, rows.length)} 项`;
    for (const node of rows.slice(0, 100)) nodeLink(node.id, label(node), out);
    return;
  }
  el('count').textContent = mode === 'Atlas'
    ? `${stats.reviewed_rev5_classes} 个类锚点 + ${stats.directory_kinds.reviewed_activity_slice || 0} 个自有活动 + ${stats.directory_kinds.source_derived_navigation} 个导航上级`
    : `全部 ${nodes.length} 个源节点`;
  const children = new Map();
  for (const node of nodes) {
    const parent = node.parents[0] || '';
    if (!children.has(parent)) children.set(parent, []);
    children.get(parent).push(node);
  }
  function tree(parent, holder) {
    for (const node of children.get(parent) || []) {
      const key = mode === 'Atlas' ? node.id : node.code;
      if (children.has(key)) {
        const box = disclosure(holder, label(node));
        nodeLink(node.id, '查看定义与对应', box);
        tree(key, box);
      } else {
        nodeLink(node.id, label(node), holder);
      }
    }
  }
  tree('', out);
}
function followLocation(focus = false) {
  const hash = location.hash.slice(1);
  if (!hash) {
    el('detail').replaceChildren(make('p', '选择节点查看定义、版本对应和证据。'));
    return;
  }
  let id;
  try { id = decodeURIComponent(hash); } catch { id = hash; }
  const mode = byId.get(id)?.edition || 'Atlas';
  if (el('edition').value !== mode) {
    el('edition').value = mode;
    el('q').value = '';
    browse();
  }
  select(id);
  if (focus) {
    el('detail').focus({preventScroll: true});
    el('detail').scrollIntoView({block: 'start'});
  }
}
for (const proposal of proposals.values()) nodeLink(proposal.id, proposal.label, el('proposals'));
el('edition').onchange = browse;
el('q').oninput = browse;
window.addEventListener('hashchange', () => followLocation(true));
browse();
followLocation();
</script></html>
