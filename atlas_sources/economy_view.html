<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ISIC 经济活动研究</title><style>
body{margin:0;font:14px/1.65 system-ui,sans-serif;color:#19382f;background:#f4f6f0}header{padding:22px 28px;border-bottom:1px solid #becdc1}h1{margin:0;font-size:25px}h2{font-size:21px}h3{margin-bottom:7px}p{margin:8px 0}main{display:grid;grid-template-columns:360px 1fr;max-width:1500px;margin:auto}aside{padding:18px;border-right:1px solid #d0dbd0;height:calc(100vh - 160px);overflow:auto}section{padding:20px 30px}input,select{padding:8px;font:inherit;border:1px solid #b5c7b9;border-radius:4px;background:white}input{width:94%;margin:10px 0}button{font:inherit;background:none;border:0;text-align:left;color:#184f3c;cursor:pointer;padding:3px 0}details details{margin-left:14px}summary{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:15px;border:1px solid #d6dfd3}article{background:white;border:1px solid #d6dfd3;border-radius:5px;padding:12px;margin:9px 0}.muted{color:#5f7467}.flag{color:#87501a}a{color:#146344}#results button{display:block;margin:5px 0}small{display:block;color:#5f7467}@media(max-width:750px){main{grid-template-columns:1fr}aside{height:280px;border-bottom:1px solid #becdc1}section{padding:18px}}
</style>
<header><small>WORLD CLASSIFICATION ATLAS / 经济活动分类研究</small><h1>ISIC 原目录、定义与版本对应</h1><p id="stats"></p><small>原始版本独立保存。对应表依据为 2025-01-17；Rev.5 注释为 2026-08-19。关系是研究候选，范围分配比例未知。</small></header>
<main><aside><select id="edition" aria-label="目录或源版本"><option value="Atlas">Atlas 已审活动目录 · 局部</option><option value="Rev.5">ISIC Rev.5 · 2026-08 注释</option><option value="Rev.4">ISIC Rev.4 · 数据库更正版</option></select><input id="q" placeholder="搜索代码、名称、说明或排除项" aria-label="搜索节点"><small id="count"></small><div id="results"></div></aside><section id="detail"><p>从左侧选择节点。Atlas 上级仅作来源骨架导航；已审活动与尚待研究的原始目录分别显示。</p></section></main>
<script id="data" type="application/json">__ECONOMY_DATA__</script><script>
const data=JSON.parse(document.getElementById('data').textContent),el=id=>document.getElementById(id),make=(tag,text)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n};
const byId=new Map([...data.old,...data.new].map(n=>[n.id,n]));
const directory=new Map(data.review.directory.map(n=>[n.id,n])),queue=new Map(data.review.queue.map(e=>[e.mapping_id,e])),cases=new Map(data.review.cases.map(e=>[e.mapping_id,e]));
const s=data.review.statistics;el('stats').textContent=`Rev.4 ${data.old.length} 个节点 · Rev.5 ${data.new.length} 个节点 · ${data.edges.length} 条官方对应 · 已审关系 ${s.mapping_status.reviewed_current_relation} 条 · Atlas 活动 ${s.reviewed_rev5_classes} 个 · 开放问题 ${s.unresolved_issues} 项`;
function evidence(parent,e){const a=make('a','官方来源');a.href=e.url;a.target='_blank';a.rel='noopener noreferrer';parent.append(a,make('small',`${e.resource_id} / SHA-256 ${e.sha256}`));if(e.sheet)parent.append(make('small',`${e.sheet}!${e.range||e.row}`))}
function atlasSelect(id){const n=directory.get(id),out=el('detail');out.replaceChildren(make('h2',n.label),make('p',n.id),make('p',n.kind==='reviewed_activity'?'已审 Rev.5 范围锚点；不同旧类保留独立的部分关联。':'来源骨架导航节点；未审定跨版语义，不计入已审活动覆盖。'));for(const p of n.parents){const b=make('button','上级：'+directory.get(p).label);b.onclick=()=>atlasSelect(p);out.append(b)}out.append(make('pre',n.definition||'未提供独立说明'),make('h3','Atlas → 来源（关系方向）'));for(const b of n.source_bindings){const button=make('button',b.node_id+' · '+(b.relation||'仅导航来源'));button.onclick=()=>select(b.node_id);out.append(button,make('br'));if(b.review_mapping_id){const c=cases.get(b.review_mapping_id);out.append(make('p',c.review.cohort_rationale||c.review.rationale));evidence(out,c.evidence)}}out.append(make('small',n.parent_basis))}
function select(id){if(directory.has(id)){atlasSelect(id);return}const n=byId.get(id);el('detail').replaceChildren(make('h2',`${n.edition} · ${n.code} ${n.label}`),make('p',n.component));const parents=make('p','原始父级：');for(const p of n.parents){const b=make('button',p+' '+byId.get(`ISIC:${n.edition}:${p}`).label);b.onclick=()=>select(`ISIC:${n.edition}:${p}`);parents.append(b)}if(!n.parents.length)parents.append(make('span','根节点'));el('detail').append(parents);evidence(el('detail'),n.evidence);
el('detail').append(make('h3','官方说明与范围'),make('pre',n.definition||'官方数据库未提供独立说明；保留为空。'));
const concepts=data.concepts.filter(c=>c.source_bindings.some(b=>b.node_id===id));for(const c of concepts){el('detail').append(make('h3','已审 Atlas 研究概念'),make('p',c.id));for(const b of c.source_bindings){const button=make('button',b.node_id+' · '+b.relation);button.onclick=()=>select(b.node_id);el('detail').append(button,make('br'))}}
for(const a of data.review.directory.filter(a=>a.source_bindings.some(b=>b.node_id===id))){const b=make('button','Atlas 局部目录：'+a.label);b.onclick=()=>atlasSelect(a.id);el('detail').append(b,make('br'))}
const changes=n.edition==='Rev.5'?data.errata.filter(e=>e.code===n.code):[];for(const e of changes){const r=data.review.errata_reviews.find(r=>r.code===e.code),d=make('details');d.append(make('summary','2024 原说明与 2026 更新说明'),make('p',e.reason||''),make('p',r.effect+' / '+r.text_agreement),make('p',r.rationale),make('pre',e.original_note_2024||''),make('pre',e.updated_note_2026||''));el('detail').append(d)}
for(const issue of data.review.issues.filter(i=>(n.edition==='Rev.4'?i.rev4_codes:i.rev5_codes).includes(n.code))){const a=make('article');a.append(make('h3','开放问题 · '+issue.id),make('p',issue.rationale));el('detail').append(a)}
el('detail').append(make('h3','官方类级对应'));const edges=data.edges.filter(e=>e.from===id||e.to===id);if(!edges.length)el('detail').append(make('p','该节点非类级或未提供直接对应，不从下级自动生成上级等价。'));
for(const e of edges){const a=make('article'),peer=e.from===id?e.to:e.from,b=make('button',`${e.from_code}（Rev.4） → ${e.to_code}（Rev.5）`),r=queue.get(e.id),c=cases.get(e.id);b.onclick=()=>select(peer);a.append(b,make('p',`${e.gsim_raw||'GSIM 空白（需结合完整对应图判断）'} · ${e.topology}`),make('p',`原范围 ${e.from_scope} / 新范围 ${e.to_scope}；研究候选 ${e.current_skos_candidate||'待审'}`),make('p',`审查：${r.status} · Rev.4 → Rev.5 ${r.reviewed_relation_rev4_to_rev5||'未批准关系'}`),make('p',e.decision_status),make('pre',e.change_description||''));if(c)a.append(make('p',c.review.cohort_rationale||c.review.rationale),make('p',c.review.rationale));if(r.issue_ids.length)a.append(make('p','问题：'+r.issue_ids.join(', ')));if(e.publisher_uncertainty)a.append(make('p','发布者原文含问号，保留不确定。'));if(e.qualified_code_issues.length)a.append(make('pre',JSON.stringify(e.qualified_code_issues,null,2)));if(e.updated_notes_affected_codes.length)a.append(make('p','2026 注释影响节点：'+e.updated_notes_affected_codes.join(', ')));evidence(a,e.evidence);el('detail').append(a)}}
function browse(){const mode=el('edition').value,nodes=mode==='Atlas'?data.review.directory.map(n=>({...n,code:n.anchor_source_id.split(':').pop()})):mode==='Rev.4'?data.old:data.new,q=el('q').value.toLowerCase(),out=el('results'),key=n=>mode==='Atlas'?n.id:n.code;out.replaceChildren();if(q){const rows=nodes.filter(n=>(n.code+' '+n.label+' '+(n.definition||'')).toLowerCase().includes(q));el('count').textContent=`匹配 ${rows.length}，显示前 ${Math.min(100,rows.length)} 项`;for(const n of rows.slice(0,100)){const b=make('button',n.code+' '+n.label);b.onclick=()=>select(n.id);out.append(b)}return}el('count').textContent=mode==='Atlas'?`${s.reviewed_rev5_classes} 个已审活动 + ${s.directory_kinds.source_derived_navigation} 个导航上级（非已审活动）`:`全部 ${nodes.length} 个源节点`;const children=new Map;for(const n of nodes){const p=n.parents[0]||'';if(!children.has(p))children.set(p,[]);children.get(p).push(n)}function tree(parent,holder){for(const n of children.get(parent)||[]){if(children.has(key(n))){const d=make('details'),summary=make('summary',n.code+' '+n.label),b=make('button','查看定义与对应');b.onclick=()=>select(n.id);d.append(summary,b);tree(key(n),d);holder.append(d)}else{const b=make('button',n.code+' '+n.label);b.onclick=()=>select(n.id);holder.append(b,make('br'))}}}tree('',out)}
el('edition').onchange=browse;el('q').oninput=browse;browse();
</script></html>
